name: CI/CD Pipeline & GitHub Pages Deployment

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install System & Build Dependencies
        run: |
          chmod +x src/install.sh
          ./src/install.sh

      - name: Install Test Dependencies
        run: |
          chmod +x test/install.sh
          ./test/install.sh

      - name: Run Build Pipeline & Asset Generation
        run: |
          chmod +x src/scripts/build_pipeline.sh
          ./src/scripts/build_pipeline.sh

      - name: Run Unit Tests
        run: |
          python3 -m unittest discover test/unit/

      - name: Run End-to-End Playwright Tests
        run: |
          python3 -m unittest discover test/e2e/

      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
